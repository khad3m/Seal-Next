name: Android CI

on:
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: PR Build Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.0 platform & build tools
        continue-on-error: true
        run: |
          yes | sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build release APKs
        run: ./gradlew assembleGenericRelease --stacktrace
