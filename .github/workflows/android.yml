name: Build Seal Next

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.0 platform & build tools
        continue-on-error: true
        run: |
          yes | sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        # -PnoSplits disables per-ABI APK splits so the single output APK targets the
        # armeabi-v7a ABI configured in gradle.properties (ABI_FILTERS). A 32-bit APK
        # also installs fine on arm64-v8a devices, so this one file covers every phone.
        run: ./gradlew assembleGenericRelease -PnoSplits --stacktrace

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionMajor = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1).$(grep -oP 'versionMinor = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1).$(grep -oP 'versionPatch = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Seal Next version: ${VERSION}"

      - name: List generated APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealNext-${{ steps.version.outputs.VERSION }}-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error

      - name: Create source backup archive
        # Full, clean snapshot of the repo source (no .git, no build outputs,
        # no local.properties) attached to every release as a backup asset.
        run: git archive --format=zip -o "SealNext-${{ steps.version.outputs.VERSION }}-source.zip" HEAD

      - name: Read release configuration
        id: release_config
        run: |
          SHOULD_RELEASE=$(jq -r '.release' release.json)
          echo "SHOULD_RELEASE=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          echo "Release flag: ${SHOULD_RELEASE}"

      - name: Create GitHub Release
        if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Seal Next v${{ steps.version.outputs.VERSION }}
          body: |
            ## ✨ Seal Next v1.2.0

            **Seal Next** — a beautiful, modern video & audio downloader for Android built on yt-dlp.

            ### 📦 Download
            | File | Device |
            | --- | --- |
            | `SealNext-1.2.0-armeabi-v7a.apk` | All Android phones — a 32-bit APK installs on arm64 devices too (recommended) |
            | `SealNext-1.2.0-source.zip` | Complete source code backup of this release |

            ### 🚀 What's new in v1.2.0
            - 🔄 **In-app updates** — the app now checks for new releases on launch and downloads & installs the update APK with one tap (Settings → About → Check for Updates for a manual check)
            - 🌐 **Browser history & bookmarks** — visited pages and saved sites persist between sessions
            - ▶️ **Picture-in-Picture + playback resume** — shrink the player to a floating window and pick up exactly where you stopped
            - 🧠 **Smarter YouTube playback** — normalized stream URLs and quality variants built from the video's real formats, NewPipe with yt-dlp fallback
            - 🏠 **Home polish** — cards, details dialogs and the glowing action button refactored into dedicated components

            ---
            **Developer:** [Md Khademul Islam](https://github.com/khad3m) · Licensed under the [MIT License](LICENSE)
          files: |
            app/build/outputs/apk/generic/release/*.apk
            SealNext-*-source.zip
          makeLatest: true
