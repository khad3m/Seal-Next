name: Build Seal Next

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 37.0 platform & build tools
        continue-on-error: true
        run: |
          yes | sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" > /dev/null 2>&1 || true

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed release APK
        # -PnoSplits disables per-ABI APK splits so the single output APK targets the
        # armeabi-v7a ABI configured in gradle.properties (ABI_FILTERS). A 32-bit APK
        # also installs fine on arm64-v8a devices, so this one file covers every phone.
        run: ./gradlew assembleGenericRelease -PnoSplits --stacktrace

      - name: Extract version name
        id: version
        run: |
          VERSION=$(grep -oP 'versionMajor = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1).$(grep -oP 'versionMinor = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1).$(grep -oP 'versionPatch = \K\d+' buildSrc/src/main/kotlin/Version.kt | head -1)
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "Seal Next version: ${VERSION}"

      - name: List generated APKs
        run: |
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SealNext-${{ steps.version.outputs.VERSION }}-armeabi-v7a
          path: app/build/outputs/apk/generic/release/*.apk
          if-no-files-found: error

      - name: Read release configuration
        id: release_config
        run: |
          SHOULD_RELEASE=$(jq -r '.release' release.json)
          echo "SHOULD_RELEASE=${SHOULD_RELEASE}" >> $GITHUB_OUTPUT
          echo "Release flag: ${SHOULD_RELEASE}"

      - name: Create GitHub Release
        if: steps.release_config.outputs.SHOULD_RELEASE == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: Seal Next v${{ steps.version.outputs.VERSION }}
          body: |
            ## ✨ Seal Next v1.1.0

            **Seal Next** — a beautiful, modern video & audio downloader for Android built on yt-dlp.

            ### 📦 Download
            | File | Device |
            | --- | --- |
            | `SealNext-1.1.0-armeabi-v7a.apk` | All Android phones — a 32-bit APK installs on arm64 devices too (recommended) |

            ### 🚀 What's new in v1.1.0
            - 🎯 **Premium fetch sheet** — paste a link and instantly see the video info card with download presets & real quality grid
            - 🛡️ **Reliable downloads** — yt-dlp auto-updates in the background every day, so YouTube & other sites keep working
            - ▶️ **Solid glassmorphism player** — double-tap to skip, swipe to seek, drag for volume & brightness, auto-hiding glass controls
            - 🌐 **PWA-style browser** — native launcher cards for YouTube / Instagram / TikTok / Facebook + any address, with a floating expandable action button
            - 🧠 **Dual-engine playback** — NewPipe Extractor now falls back to the yt-dlp engine, fixing most YouTube "missing …" errors

            ---
            **Developer:** [Md Khademul Islam](https://github.com/khad3m) · Licensed under the [MIT License](LICENSE)
          files: |
            app/build/outputs/apk/generic/release/*.apk
          makeLatest: true
